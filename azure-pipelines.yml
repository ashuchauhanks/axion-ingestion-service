trigger:
  branches:
    include:
      - main

# pr:
#   branches:
#     include:
#       - main

pool: selfhost-aks

variables:

  acrName: 'acrashudevka'
  acrLoginServer: 'acrashudevka.azurecr.io'

  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  buildContext: '$(Build.SourcesDirectory)'

  imageRepository: 'axion-ingestion-service'
  imageTag: '$(Build.BuildId)'

  kubernetesNamespace: 'axion'
  deploymentName: 'axion-ingestion-service'
  containerName: 'axion-ingestion-service'

  aksResourceGroup: 'rg-aks-dev'
  aksClusterName: 'aks-dev'


stages:

- stage: BuildAndPush
  displayName: 'Build and Push Ingestion Service'

  jobs:

  - job: BuildAndPush
    displayName: 'Build Docker Image and Push to ACR'

    steps:

    - checkout: self
      displayName: 'Checkout Source Code'

    - task: Docker@2
      displayName: 'Build Docker Image'
      inputs:
        repository: '$(imageRepository)'
        command: 'build'
        Dockerfile: '$(dockerfilePath)'
        buildContext: '$(buildContext)'
        tags: |
          $(imageTag)

    - task: Docker@2
      displayName: 'Build & Push Docker Image'
      inputs:
        containerRegistry: 'acr-svc-msi-1'   # Service Connection name hai//- Docker registry (ACR Type) - managed identity//
        repository: '$(imageRepository)'
        command: 'buildAndPush'
        Dockerfile: '$(dockerfilePath)'
        buildContext: '$(buildContext)'
        tags: '$(imageTag)'

    # - task: AzureCLI@3
    #   displayName: 'Build & push Docker Image - Scipt'
    #   inputs:
    #     connectionType: 'azureRM'
    #     azureSubscription: 'SVC-AZ-ARM-250926'
    #     scriptType: 'bash'
    #     scriptLocation: 'inlineScript'
    #     inlineScript: |
    #       az acr login --name $(acrName)
          
    #       docker tag $(imageRepository):$(imageTag) $(acrLoginServer)/$(imageRepository):$(imageTag)
          
    #       docker push $(acrLoginServer)/$(imageRepository):$(imageTag)

- stage: DeployToAKS
  displayName: 'Deploy Ingestion Service to AKS'

  dependsOn: BuildAndPush
  condition: succeeded()

  jobs:
  - job: Deploy
    displayName: 'Deploy to AKS'

    steps:

    - checkout: self
      displayName: 'Checkout Source Code'

    # - task: AzureCLI@2
    #   displayName: 'Deploy to AKS'
    #   inputs:
    #     azureSubscription: 'SVC-AZ-ARM-250926'
    #     scriptType: 'bash'
    #     scriptLocation: 'inlineScript'
    #     inlineScript: |

    #       az aks get-credentials --resource-group "$(aksResourceGroup)" --name "$(aksClusterName)" --overwrite-existing

    #       kubectl apply -f "$(Build.SourcesDirectory)/manifest/deployment.yaml" -f "$(Build.SourcesDirectory)/manifest/service.yaml" -n "$(kubernetesNamespace)"

    #       kubectl set image deployment/$(deploymentName) $(containerName)=$(acrLoginServer)/$(imageRepository):$(imageTag) -n "$(kubernetesNamespace)"

    #       kubectl rollout status deployment/$(deploymentName) -n "$(kubernetesNamespace)" --timeout=5m

    #       kubectl get pods -n "$(kubernetesNamespace)"

    #       kubectl get svc -n "$(kubernetesNamespace)"

    #       kubectl get deployment $(deploymentName) -n "$(kubernetesNamespace)"



    - task: Kubernetes@1
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'SVC-AZ-ARM-250926'
        azureResourceGroup: 'rg-aks-dev'
        kubernetesCluster: 'aks-dev'
        namespace: 'axion'
        command: 'apply'
        secretType: 'dockerRegistry'
        containerRegistryType: 'Azure Container Registry'
        azureSubscriptionEndpointForSecrets: 'SVC-AZ-ARM-250926'
        azureContainerRegistry: 'acrashudevka.azurecr.io'
        versionOrLocation: 'location'
        specifyLocation: '/usr/local/bin/kubectl'
        workingDirectory: '$(System.DefaultWorkingDirectory)/manifest/*'